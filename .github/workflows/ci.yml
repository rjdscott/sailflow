name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
      - run: make setup
      - run: make check

  # Software-rendered UI smoke, in the same image the screenshot baselines were
  # generated in — SwiftShader output shifts between Chromium builds, so the
  # tag is pinned here and in playwright.config.ts and they must move together
  # (research 2026-08-25-cockpit/03, risk 8). Also asserts the first-load
  # bundle has not grown, which is what makes ADR 0014's lazy 3D chunk honest.
  ui-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: make setup
      - run: pnpm build
      - run: node scripts/bundle_check.mjs
      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # The polar hold-out gate currently FAILs on known rows (ADR 0007,
  # validation/report.md), so this job reports rather than blocks: it
  # regenerates the report on every push and puts the held-out tables and the
  # gate verdict in the job summary, where a regression is visible in the PR.
  # Flip continue-on-error off the day the gate is green.
  validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: make setup
      - run: make validate

      - name: Hold-out table into the job summary
        if: always()
        run: |
          {
            echo "## Polar hold-out gate"
            echo
            awk '
              /^### TWS .*HELD-OUT/ { p = 1 }
              /^## Gate/            { p = 1 }
              /^### TWS .*FIT/      { p = 0 }
              /^## Model optimum/   { p = 0 }
              p
            ' validation/report.md
            echo
            echo "Full report: the \`validation-report\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation/report.md
